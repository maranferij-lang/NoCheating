services:
  nocheating:
    build: .
    ports:
      - "3000:3000"
    environment:
      PROCTOR_PIN: "1234"          # change before demoing
      # PUBLIC_URL: "https://your-domain.example"   # for the phone QR code, if behind a proxy
    volumes:
      - nocheating-data:/data
    restart: unless-stopped
volumes:
  nocheating-data:
